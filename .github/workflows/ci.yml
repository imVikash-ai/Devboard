# Goal - I have to Lint, build, test the code for the frontend and backend and then pushed the images to the Docker hub.

name: CI

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm  install
        working-directory: frontend
        
      - name: Run Linter
        run: npm run lint 
        working-directory: frontend


      - name: Run Tests
        run: npm run test 
        working-directory: frontend



  # backend: