# Goal - I have to Lint, build, test the code for the frontend and backend and then pushed the images to the Docker hub.

name: CI

on:
  # push:
    # paths:
    #   - '**'
    #   - '!.github/workflows/**'
    # branches: [main]
    workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name: Run Tests
        run: npm run test 
        working-directory: frontend

      - name: Docker Setup (login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./frontend
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        
      - name: Run Tests
        run: go test 
        working-directory: backend

      - name: Docker Setup (login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./backend
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest

