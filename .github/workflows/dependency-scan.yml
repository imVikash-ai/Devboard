# Goal: I have to ensure the packages and the dependencies have been audited and scanned for vulnerabilities for the security. 

name: Dependency Scan

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: '1.22'
                go-version-file: 'go.mod'
                cache-dependency-path: go.sum
            
            - name: Install Govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

            - name: Govulncheck
              continue-on-error: true  # Continue even if vulnerabilities are found
              run: govulncheck ./... > reports/dependency-report.txt
              working-directory: backend

            - name: Upload Report to Artifacts
              if: always()  # Ensure the artifact is uploaded even if the previous step fails
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report
                path: reports/dependency-report.txt
                retention-days: 7  # Keep the artifact for 7 days

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name: Run Dependency Scan for Node
              run: npm audit
              working-directory: frontend