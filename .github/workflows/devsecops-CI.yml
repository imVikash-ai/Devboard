# Goal: TO run ENd to End DevSecOps CI Pipeline. 

name: Devsecops

on:
    push:
        branches: [main]

jobs:

    # Code Stage (with Shift left)
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    # Secret Scanning Stage
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    Dependency-Checks:
        uses: ./.github/workflows/dependency-scan.yml

    docker-check:
        uses: ./.github/workflows/docker-scan.yml
        secrets: inherit

    # SonarQube Stage
    sonarqube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    code-tests:
        uses: ./.github/workflows/code-tests.yml

    docker-push:
        needs: [code-quality, secret-scanning, Dependency-Checks, docker-check, sonarqube, code-tests]                              
        uses: ./.github/workflows/docker-push.yml
        secrets: inherit